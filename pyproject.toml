[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-admin-home"
version = "0.4.0"
description = "A tree-navigation sidebar, home dashboard and header user menu for the Django admin"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabio Valle" }]
keywords = ["django", "admin", "dashboard", "sidebar", "navigation", "django-admin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = ["Django>=3.2"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[project.urls]
Homepage = "https://github.com/fdelvalle/django-admin-home"
Issues = "https://github.com/fdelvalle/django-admin-home/issues"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["django_admin_home*"]

[tool.setuptools.package-data]
django_admin_home = [
    "templates/admin/*.html",
    "templates/admin_home/*.html",
    "static/django_admin_home/css/*.css",
    "static/django_admin_home/js/*.js",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", "__pycache__", "migrations", ".venv", "dist", "build"]

lint.select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
lint.ignore = ["E501", "B008"]
fix = true

[tool.ruff.lint.isort]
known-first-party = ["django_admin_home"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
